# GitHub Actions: Diting 自动打包分发
#
# 触发条件：推送 v* tag（如 v5.1.4）
# 构建 macOS (ARM64 + x64)、Linux (x64)、Windows (x64) 产物并发布到 GitHub Releases
#
# 所需 GitHub Secrets（macOS 签名/公证，可选）:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置
#
# 优化项：
# 1. npm + Electron 二进制缓存（actions/cache + setup-node cache）
# 2. npm ci 替代 npm install（需提交 package-lock.json）
# 3. 前端构建提取为独立 Job，各平台下载复用（避免重复构建）
# 4. 按平台排除非目标资源（builder 配置中的 files 过滤）
# 5. merge-mac-yml 通过 artifact 传递 SHA，不再下载 zip
# 6. 分离打包和上传，失败重试不重复打包（--dir 打包 + gh upload 分离）
#
# 使用方式：
#   1. 在 release-notes/ 目录创建 vX.X.X.md 更新日志
#   2. git tag vX.X.X
#   3. git push origin vX.X.X
#   4. CI 自动构建 4 个平台产物并发布到 GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  # Job 0: 创建 Draft Release
  # ============================================================
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          NOTES_FILE="release-notes/${TAG}.md"

          # 检查 Release 是否已存在
          EXISTING=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          " || true)

          if [ -n "$EXISTING" ]; then
            echo "Release already exists (ID: ${EXISTING}), skipping creation"
            exit 0
          fi

          # 用 Python 构造 JSON payload（安全处理多行文本和特殊字符）
          PAYLOAD=$(python3 -c "
          import json
          tag = '${TAG}'
          notes_file = '${NOTES_FILE}'
          try:
              with open(notes_file, 'r') as f:
                  body = f.read()
          except FileNotFoundError:
              body = f'Release {tag}'
          print(json.dumps({'tag_name': tag, 'name': tag, 'body': body, 'draft': True, 'prerelease': False}))
          ")

          # 创建 draft release
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(f'Created draft release: {r.get(\"id\",\"?\")} (tag: {r.get(\"tag_name\",\"?\")})')"

  # ============================================================
  # Job 1: 构建前端 + Electron 主进程（平台无关，只构建一次）
  #
  # 前端产物（HTML/JS/CSS）和 Electron 主进程 bundle 是平台无关的，
  # 只需构建一次，各平台 Job 下载复用，避免 4 个 Job 重复构建。
  # ============================================================
  build-frontend:
    name: Build Frontend & Electron
    runs-on: ubuntu-latest
    needs: create-release
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # 安装根依赖（npm ci 比 npm install 快 2-3 倍，跳过依赖树解析）
      - name: 安装根依赖
        run: npm ci

      # 安装前端依赖
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        run: npm run build-frontend

      - name: 构建 Electron 主进程
        run: npm run build-electron

      # 验证前端产物存在
      - name: 验证构建产物
        run: |
          if [ ! -f public/dist/index.html ]; then
            echo "[FAIL] 前端构建失败：public/dist/index.html 不存在"
            exit 1
          fi
          echo "[OK] 前端构建产物验证通过"
          ls -la public/dist/index.html

      # 上传前端 + Electron 产物供各平台 Job 下载
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            public/dist/
            public/electron/
          retention-days: 1

  # ============================================================
  # Job 2: macOS ARM64 (Apple Silicon)
  # ============================================================
  build-mac-arm64:
    name: build (macos-latest, mac, arm64)
    runs-on: macos-latest
    needs: build-frontend
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # 缓存 Electron 二进制（~270MB），避免每次重新下载
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-arm64-39.8.10
          restore-keys: |
            electron-mac-arm64-

      # 下载前端 + Electron 构建产物
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: public/

      # 安装根依赖（仅安装 native 模块所需，npm ci 快速安装）
      - name: 安装根依赖
        run: npm ci

      # macOS 代码签名准备
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        if: ${{ env.MAC_CERTS != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 重编译 native 模块
        run: npx electron-rebuild -f -w better-sqlite3,canvas,node-pty

      # 优化6: 分离打包和上传
      # 先用 --dir 打包（不签名不公证不发布），再单独签名+公证，最后上传
      # 失败重试时只需重试上传，不重复打包
      - name: 打包 (macOS ARM64, --dir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config ./cmd/builder-mac-arm64.json --mac --arm64 --publish never

      # 计算 SHA512 和大小（供 merge-mac-yml 使用，避免后续下载 zip）
      - name: 计算 SHA512
        id: sha
        run: |
          ZIP=$(ls out/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "[FAIL] 未找到 zip 产物"
            exit 1
          fi
          BASENAME=$(basename "$ZIP")
          SHA512=$(openssl dgst -sha512 -binary "$ZIP" | base64)
          SIZE=$(stat -f%z "$ZIP")
          echo "zip_name=$BASENAME" >> $GITHUB_OUTPUT
          echo "sha512=$SHA512" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "[OK] ARM64: $BASENAME size=$SIZE"

      # 上传 SHA 信息作为 artifact
      - name: 上传 SHA 信息
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-sha
          path: out/*.zip
          retention-days: 1

      # 上传到 GitHub Release（分离上传，失败重试不重复打包）
      - name: 上传到 Release (macOS ARM64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # 查找 draft release
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")
          if [ -z "$RELEASE_ID" ]; then
            echo "[FAIL] 未找到 Release"
            exit 1
          fi
          ZIP=$(ls out/*.zip | head -1)
          BASENAME=$(basename "$ZIP")
          echo "上传 $BASENAME 到 Release $RELEASE_ID..."
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sL -o /tmp/upload_resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/zip" \
              --data-binary @"$ZIP" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${BASENAME}")
            if echo "$HTTP_CODE" | grep -qE '^(20[0-9])$'; then
              UPLOADED_NAME=$(python3 -c "import json; d=json.load(open('/tmp/upload_resp.txt')); print(d.get('name','?'))" 2>/dev/null || echo "$BASENAME")
              echo "[OK] Uploaded: $UPLOADED_NAME"
              # 同时上传 blockmap（如果存在）
              BLOCKMAP="${ZIP%.zip}.blockmap"
              if [ -f "$BLOCKMAP" ]; then
                curl -sL -X POST \
                  -H "Authorization: token ${GH_TOKEN}" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$BLOCKMAP" \
                  "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$BLOCKMAP")" || true
              fi
              exit 0
            fi
            echo "上传重试 $i... (HTTP $HTTP_CODE)"
            sleep 5
          done
          echo "[FAIL] 上传失败"
          exit 1

  # ============================================================
  # Job 3: macOS x64 (Intel)
  # ============================================================
  build-mac-x64:
    name: build (macos-latest, mac, x64)
    runs-on: macos-latest
    needs: build-frontend
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-mac-x64-39.8.10
          restore-keys: |
            electron-mac-x64-

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: public/

      - name: 安装根依赖
        run: npm ci

      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        if: ${{ env.MAC_CERTS != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 重编译 native 模块 (x64)
        run: npx electron-rebuild -f -a x64 -w better-sqlite3,canvas,node-pty

      - name: 打包 (macOS x64, --dir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config ./cmd/builder-mac.json --mac --x64 --publish never

      - name: 计算 SHA512
        id: sha
        run: |
          ZIP=$(ls out/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "[FAIL] 未找到 zip 产物"
            exit 1
          fi
          BASENAME=$(basename "$ZIP")
          SHA512=$(openssl dgst -sha512 -binary "$ZIP" | base64)
          SIZE=$(stat -f%z "$ZIP")
          echo "zip_name=$BASENAME" >> $GITHUB_OUTPUT
          echo "sha512=$SHA512" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "[OK] X64: $BASENAME size=$SIZE"

      - name: 上传 SHA 信息
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64-sha
          path: out/*.zip
          retention-days: 1

      - name: 上传到 Release (macOS x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")
          if [ -z "$RELEASE_ID" ]; then
            echo "[FAIL] 未找到 Release"
            exit 1
          fi
          ZIP=$(ls out/*.zip | head -1)
          BASENAME=$(basename "$ZIP")
          echo "上传 $BASENAME 到 Release $RELEASE_ID..."
          for i in 1 2 3; do
            HTTP_CODE=$(curl -sL -o /tmp/upload_resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/zip" \
              --data-binary @"$ZIP" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${BASENAME}")
            if echo "$HTTP_CODE" | grep -qE '^(20[0-9])$'; then
              UPLOADED_NAME=$(python3 -c "import json; d=json.load(open('/tmp/upload_resp.txt')); print(d.get('name','?'))" 2>/dev/null || echo "$BASENAME")
              echo "[OK] Uploaded: $UPLOADED_NAME"
              BLOCKMAP="${ZIP%.zip}.blockmap"
              if [ -f "$BLOCKMAP" ]; then
                curl -sL -X POST \
                  -H "Authorization: token ${GH_TOKEN}" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$BLOCKMAP" \
                  "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$BLOCKMAP")" || true
              fi
              exit 0
            fi
            echo "上传重试 $i... (HTTP $HTTP_CODE)"
            sleep 5
          done
          echo "[FAIL] 上传失败"
          exit 1

  # ============================================================
  # Job 4: 合并 macOS latest-mac.yml（ARM64 + x64 双架构更新清单）
  #
  # 优化5: 通过 GitHub Actions artifact 传递 SHA 信息，
  # 不再从 Release 下载 300MB+ zip 仅为计算 SHA512。
  # ============================================================
  merge-mac-yml:
    name: Merge latest-mac.yml (arm64 + x64)
    runs-on: ubuntu-latest
    needs: [build-mac-arm64, build-mac-x64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 下载两个架构的 zip 产物（用于计算 SHA）
      - name: 下载 ARM64 产物
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64-sha
          path: mac-arm64/

      - name: 下载 x64 产物
        uses: actions/download-artifact@v4
        with:
          name: mac-x64-sha
          path: mac-x64/

      - name: 合并 latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"

          # 找到 zip 文件
          ARM64_ZIP=$(ls mac-arm64/*.zip 2>/dev/null | head -1)
          X64_ZIP=$(ls mac-x64/*.zip 2>/dev/null | head -1)

          if [ -z "$ARM64_ZIP" ] || [ -z "$X64_ZIP" ]; then
            echo "[FAIL] 缺少 macOS zip 产物"
            exit 1
          fi

          ARM64_BASENAME=$(basename "$ARM64_ZIP")
          X64_BASENAME=$(basename "$X64_ZIP")

          # 本地计算 SHA512（不再从 Release 下载）
          ARM64_SHA=$(openssl dgst -sha512 -binary "$ARM64_ZIP" | base64 -w0)
          ARM64_SIZE=$(stat --format=%s "$ARM64_ZIP")
          X64_SHA=$(openssl dgst -sha512 -binary "$X64_ZIP" | base64 -w0)
          X64_SIZE=$(stat --format=%s "$X64_ZIP")

          echo "ARM64: $ARM64_BASENAME size=$ARM64_SIZE sha=${ARM64_SHA:0:20}..."
          echo "X64: $X64_BASENAME size=$X64_SIZE sha=${X64_SHA:0:20}..."

          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # 生成合并后的 latest-mac.yml
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${ARM64_BASENAME}
              sha512: ${ARM64_SHA}
              size: ${ARM64_SIZE}
            - url: ${X64_BASENAME}
              sha512: ${X64_SHA}
              size: ${X64_SIZE}
          path: ${ARM64_BASENAME}
          sha512: ${ARM64_SHA}
          releaseDate: '${RELEASE_DATE}'
          EOF
          sed -i 's/^          //' latest-mac.yml

          echo "=== Merged latest-mac.yml ==="
          cat latest-mac.yml

          # 查找 Release
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")

          if [ -z "$RELEASE_ID" ]; then
            echo "[FAIL] 未找到 Release for tag ${TAG}"
            exit 1
          fi

          # 删除旧的 latest-mac.yml
          ASSET_IDS=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets" \
            | python3 -c "
          import json, sys
          for a in json.load(sys.stdin):
              if a['name'] == 'latest-mac.yml':
                  print(a['id'])
          " || true)

          for ASSET_ID in $ASSET_IDS; do
            echo "Deleting old latest-mac.yml (asset ${ASSET_ID})..."
            curl -s -X DELETE -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/releases/assets/${ASSET_ID}"
          done

          # 上传合并后的 latest-mac.yml
          echo "Uploading merged latest-mac.yml..."
          UPLOAD_RESULT=$(curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: text/yaml" \
            --data-binary @latest-mac.yml \
            "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=latest-mac.yml")

          echo "$UPLOAD_RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Uploaded: {d.get(\"name\",\"?\")} ({d.get(\"size\",\"?\")} bytes)')"
          echo "[OK] latest-mac.yml merged and uploaded"

  # ============================================================
  # Job 5: Linux x64
  # ============================================================
  build-linux-x64:
    name: build (ubuntu-latest, linux, x64)
    runs-on: ubuntu-latest
    needs: build-frontend
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-x64-39.8.10
          restore-keys: |
            electron-linux-x64-

      # Linux 环境需要 canvas 的系统依赖
      - name: 安装 canvas 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: public/

      - name: 安装根依赖
        run: npm ci

      - name: 重编译 native 模块
        run: npx electron-rebuild -f -w better-sqlite3,canvas,node-pty

      # 分离打包和上传
      - name: 打包 (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config ./cmd/builder-linux.json --linux --x64 --publish never

      - name: 上传到 Release (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")
          if [ -z "$RELEASE_ID" ]; then
            echo "[FAIL] 未找到 Release"
            exit 1
          fi
          for i in 1 2 3; do
            SUCCESS=true
            for FILE in out/*.deb; do
              [ -f "$FILE" ] || continue
              BASENAME=$(basename "$FILE")
              echo "上传 $BASENAME..."
              HTTP_CODE=$(curl -sL -o /tmp/upload_resp.txt -w "%{http_code}" -X POST \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Content-Type: application/vnd.debian.binary-package" \
                --data-binary @"$FILE" \
                "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${BASENAME}")
              if echo "$HTTP_CODE" | grep -qE '^(20[0-9])$'; then
                UPLOADED_NAME=$(python3 -c "import json; d=json.load(open('/tmp/upload_resp.txt')); print(d.get('name','?'))" 2>/dev/null || echo "$BASENAME")
                echo "[OK] Uploaded: $UPLOADED_NAME"
              else
                echo "[FAIL] HTTP $HTTP_CODE"
                SUCCESS=false
              fi
            done
            if $SUCCESS; then exit 0; fi
            echo "上传重试 $i..."
            sleep 5
          done
          echo "[FAIL] 上传失败"
          exit 1

  # ============================================================
  # Job 6: Windows x64
  # ============================================================
  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest
    needs: build-frontend
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\.cache\electron
            ~\.cache\electron-builder
          key: electron-win-x64-39.8.10
          restore-keys: |
            electron-win-x64-

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: public/

      - name: 安装根依赖
        run: npm ci

      - name: 重编译 native 模块
        run: npx electron-rebuild -f -w better-sqlite3,canvas,node-pty

      # 分离打包和上传
      - name: 打包 (Windows x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config ./cmd/builder.json --win --x64 --publish never

      - name: 上传到 Release (Windows x64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")
          if [ -z "$RELEASE_ID" ]; then
            echo "[FAIL] 未找到 Release"
            exit 1
          fi
          for i in 1 2 3; do
            SUCCESS=true
            for FILE in out/*.exe; do
              [ -f "$FILE" ] || continue
              BASENAME=$(basename "$FILE")
              echo "上传 $BASENAME..."
              HTTP_CODE=$(curl -sL -o /tmp/upload_resp.txt -w "%{http_code}" -X POST \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Content-Type: application/vnd.microsoft.portable-executable" \
                --data-binary @"$FILE" \
                "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${BASENAME}")
              if echo "$HTTP_CODE" | grep -qE '^(20[0-9])$'; then
                UPLOADED_NAME=$(python3 -c "import json; d=json.load(open('/tmp/upload_resp.txt')); print(d.get('name','?'))" 2>/dev/null || echo "$BASENAME")
                echo "[OK] Uploaded: $UPLOADED_NAME"
              else
                echo "[FAIL] HTTP $HTTP_CODE"
                SUCCESS=false
              fi
            done
            if $SUCCESS; then exit 0; fi
            echo "上传重试 $i..."
            sleep 5
          done
          echo "[FAIL] 上传失败"
          exit 1

  # ============================================================
  # Job 7: 更新 Release Notes 并发布 Draft Release
  # ============================================================
  update-release-notes:
    name: Update Release Notes & Publish
    runs-on: ubuntu-latest
    needs: [build-mac-arm64, build-mac-x64, merge-mac-yml, build-linux-x64, build-windows-x64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新 Release Notes 并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          NOTES_FILE="release-notes/${TAG}.md"

          # 查找 Release（draft 状态，需遍历列表）
          RELEASE_ID=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases" \
            | python3 -c "
          import json, sys
          for r in json.load(sys.stdin):
              if r.get('tag_name') == '${TAG}':
                  print(r['id']); break
          ")

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Release not found for tag ${TAG}"
            exit 1
          fi
          echo "Release ID: ${RELEASE_ID}"

          # 读取 release notes
          if [ -f "$NOTES_FILE" ]; then
            echo "Found release notes file: ${NOTES_FILE}"
            BODY=$(python3 -c "
          import json
          with open('${NOTES_FILE}', 'r') as f:
              print(json.dumps(f.read()))
          ")
          else
          echo "[WARN] No release notes file found at ${NOTES_FILE}, using default"
          BODY=$(python3 -c "import json; print(json.dumps('Release ${TAG}'))")
          fi

          # 更新 Release body 并发布（draft: false）
          curl -s -X PATCH \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": ${BODY}, \"draft\": false}" \
            "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}" \
            | python3 -c "import json,sys; r=json.load(sys.stdin); print(f'[OK] Release published: {r.get(\"tag_name\",\"?\")} (draft={r.get(\"draft\",\"?\")})')"
